suite: test myorg.name, myorg.fullname, myorg.chart
templates:
  - configmap.yaml
chart:
  version: "0.1.0"
  appVersion: "0.1.0"
tests:

  # ─── myorg.name ───────────────────────────────────────────────────────────

  - it: "myorg.name — default uses wrapper chart name"
    asserts:
      - equal:
          path: data.name
          value: "test-commons"

  - it: "myorg.name — nameOverride replaces chart name"
    set:
      nameOverride: "my-app"
    asserts:
      - equal:
          path: data.name
          value: "my-app"

  - it: "myorg.name — long nameOverride is truncated to 63 chars"
    set:
      nameOverride: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"  # 64 chars
    asserts:
      - matchRegex:
          path: data.name
          pattern: "^.{1,63}$"

  - it: "myorg.name — trailing hyphen is trimmed after truncation"
    set:
      nameOverride: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-"  # 63 chars, ends with hyphen
    asserts:
      - matchRegex:
          path: data.name
          pattern: "[^-]$"

  # ─── myorg.fullname ───────────────────────────────────────────────────────

  - it: "myorg.fullname — default: release-chartname (branch 3: default printf)"
    asserts:
      - equal:
          path: metadata.name
          value: "RELEASE-NAME-test-commons"

  - it: "myorg.fullname — fullnameOverride takes precedence (branch 1)"
    set:
      fullnameOverride: "my-full-override"
    asserts:
      - equal:
          path: metadata.name
          value: "my-full-override"
      - equal:
          path: data.fullname
          value: "my-full-override"

  - it: "myorg.fullname — release name containing chart name uses release only (branch 2)"
    release:
      name: "test-commons"
    asserts:
      - equal:
          path: metadata.name
          value: "test-commons"

  - it: "myorg.fullname — release name prefixed with chart name also triggers branch 2"
    release:
      name: "test-commons-app"
    asserts:
      - equal:
          path: metadata.name
          value: "test-commons-app"

  - it: "myorg.fullname — fullnameOverride is truncated to 63 chars"
    set:
      fullnameOverride: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"  # 64 chars
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: "^.{1,63}$"

  # ─── myorg.chart ──────────────────────────────────────────────────────────

  - it: "myorg.chart — default is chartName-chartVersion"
    asserts:
      - equal:
          path: data.chart
          value: "test-commons-0.1.0"

  - it: "myorg.chart — plus sign in version is replaced with underscore"
    chart:
      version: "1.2.3+build.456"
    asserts:
      - equal:
          path: data.chart
          value: "test-commons-1.2.3_build.456"
